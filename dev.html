<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a7a84" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>RimTrace – Entwicklerseite</title>
  </head>
  <body class="dev-page">
    <header class="app-header">
      <a class="brand" href="./" title="Zur Startseite"><img src="/favicon.svg" alt="" aria-hidden="true" /><span>RimTrace</span></a>
      <span class="page-title">Entwickler · <span id="status" aria-live="polite"></span></span>
      <span class="spacer"></span>
      <div class="controls">
        <label>Testfall <select id="scenario"></select></label>
        <label>Auswertung
          <select id="path">
            <option value="real" selected>echte Aufnahme</option>
            <option value="synthetic">synthetisch</option>
          </select>
        </label>
        <label class="file">Videodatei <input id="file" type="file" accept="video/*" /></label>
        <button id="record" title="Nimmt den gewählten Testfall 15 s in Echtzeit als Video auf und lädt es als Videoquelle">Testvideo aufnehmen</button>
        <a id="download" hidden>Video speichern</a>
        <button id="toggle">Pause</button>
        <button id="reset">Zurücksetzen</button>
        <label>Tempo
          <select id="speed">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="4" selected>4×</option>
            <option value="8">8×</option>
          </select>
        </label>
      </div>
    </header>

    <div id="warn" class="warn" role="alert" hidden>Rad dreht zu schnell (mehr als ½ Speiche pro Bild): Bilder verworfen, Position verloren. Langsamer drehen.</div>

    <main>
      <canvas id="view"></canvas>

      <section class="grid">
        <div id="values" class="panel"></div>
        <div class="panel">
          <h2>Top-3-Maßnahmen</h2>
          <ol id="actions"></ol>
        </div>
      </section>

      <section class="panel">
        <h2>Messbereiche (Setup, JSON)</h2>
        <p id="setupInfo" class="muted"></p>
        <textarea id="setupText" spellcheck="false" rows="14"></textarea>
        <p><button id="setupDefault">Standard</button> <span id="setupMsg"></span></p>
      </section>

      <section class="grid">
        <div class="panel"><h2>Seitenschlag (mm)</h2><div id="chartLat"></div></div>
        <div class="panel"><h2>Höhenschlag (mm)</h2><div id="chartH"></div></div>
      </section>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
